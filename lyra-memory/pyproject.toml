[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-memory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["lyra_memory*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
