[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "1.0.0"
description = "Simple conversational assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Lyra contributors" },
]
dependencies = ["readchar>=4.0.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
lyra = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["lyra*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
